[pytest]
testpaths = tests
# tests/ is not a package; conftest.py puts the repo root and engine/ on the
# path, and the test modules import each other's helpers by bare name.
addopts = -ra --import-mode=prepend
markers =
    slow: solves a system's full default trajectory (seconds, not milliseconds)
filterwarnings =
    # pybounds' simulator calls int(np.round(float(t))) on a 0-d array once per
    # step, which is thousands of identical DeprecationWarnings per run — enough
    # noise to hide a real one. Upstream's to fix; silenced here so the output
    # of a failing test is readable.
    ignore:Conversion of an array with ndim > 0 to a scalar is deprecated:DeprecationWarning
